 if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(30,freq),t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.01)}catch(_){}}

 else{rect(-10,-87+breath,5,4,'#2a2630');rect(7,-87+breath,5,4,'#2a2630')}

 // character-specific attack trails and hit arcs
 if(att){ctx.strokeStyle=bossMode?'#ff5474':i===0?'#bda5ff':i===1?'#8cdbfa':i===2?'#ffdc75':'#ff925d';ctx.lineWidth=a.atkKind==='skill'?7:4;ctx.beginPath();ctx.arc(24,-53,att&&a.atkKind==='skill'?49:34,-1.1,.7);ctx.stroke()}
 if(a.slam>0){rect(-23,-17,46,6,'#8dd8ff');rect(-14,-7,28,8,'#d4f3ff')}
 if(a.skillRush>0){for(let t=0;t<3;t++)rect(-38-t*13,-65+t*13,17,5,'#f8c65b99')}

function drawF(a){
 if(a.hp<=0)return;
 const id=a.isBoss?(phase===2?'boss2':'boss1'):['sage','monkey','gold','rider'][C.indexOf(a.c)];
 const im=spriteImages[id];
 if(!im||!im.complete||!im.naturalWidth){drawFallback(a);return}
 const isBig=a.isBoss&&phase===2;
 const h=isBig?252:a.isBoss?154:161;
 const w=h*im.naturalWidth/im.naturalHeight;
 const run=Math.abs(a.vx)>45&&a.y>=429,air=a.y<429,att=a.atk>0;
 const state=a.lastHit>0?'hurt':a.atk>0?a.atkKind:a.y<429?'jump':run?'walk':'idle';
 const rate=state==='idle'?5:state==='walk'?12:state==='jump'?9:state==='heavy'?15:state==='skill'?13:18;
 const isRider=id==='rider';
 const frames=isRider?riderFrames[state]||riderFrames.idle:null;
 const nframes=isRider?frames.length:1;
 const frame=(state==='light'||state==='heavy'||state==='skill')?Math.max(0,Math.min(nframes-1,Math.floor((1-a.atk/(state==='skill'?.54:state==='heavy'?.38:.25))*nframes))):Math.floor(a.anim*rate/9)%nframes;
 ctx.save();
 ctx.fillStyle='#090c16a0';ctx.beginPath();ctx.ellipse(a.x,432,Math.max(24,w*.36),7,0,0,Math.PI*2);ctx.fill();
 ctx.translate(Math.round(a.x),Math.round(a.y));ctx.scale(a.face,1);
 if(a.lastHit>0&&Math.floor(clock*22)%2===0)ctx.globalAlpha=.65;
 const pose=isRider?frames[frame]:null;
 if(pose&&pose.complete&&pose.naturalWidth){
  // Every frame is a validated standalone transparent image with a fixed 160px canvas.
  const fw=h*1.05;ctx.drawImage(pose,-fw/2,-h,fw,h);
 }else if(!isRider){ctx.drawImage(im,-w/2,-h,w,h)}
 else if(spriteImages.rider.complete){ctx.drawImage(spriteImages.rider,-w/2,-h,w,h)}
 // Motion accents provide a readable attack/defend state while sprite-by-sprite poses are developed.
 if(att){
  const hue=a.isBoss?'#ff5c75':id==='sage'?'#d2b4ff':id==='monkey'?'#75d7ff':id==='gold'?'#ffcb59':'#ff8e55';
  const length=a.atkKind==='heavy'?w*.88:w*.72;
  ctx.strokeStyle=hue;ctx.lineWidth=a.atkKind==='skill'?9:5;ctx.beginPath();ctx.arc(w*.28,-h*.52,length*.68,-1.3,.65);ctx.stroke();
  ctx.fillStyle='#fff5d4';ctx.fillRect(w*.42,-h*.58,Math.max(10,length*.5),6);
 }
 if(a.guard){ctx.strokeStyle='#a3efff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(8,-h*.5,w*.56,-1.1,1.1);ctx.stroke()}
 if(a.slam>0){ctx.fillStyle='#89d9ff';ctx.fillRect(-w*.45,-12,w*.9,9)}
 if(a.skillRush>0){ctx.fillStyle='#ffc75a88';for(let k=0;k<4;k++)ctx.fillRect(-w*.8-k*16,-h*.55+k*12,25,5)}
 if(a===player){ctx.fillStyle='#ffdf78';ctx.beginPath();ctx.moveTo(0,-h-12);ctx.lineTo(-10,-h-28);ctx.lineTo(10,-h-28);ctx.fill()}
 if(a.lock>0){ctx.fillStyle='#ff9aa7';ctx.font='bold 14px monospace';ctx.fillText('STOP',-18,-h-30)}
 ctx.restore();
 if(a.team===0&&mode==='boss'){
  rect(a.x-24,a.y-h-38,48,5,'#171923');rect(a.x-24,a.y-h-38,48*a.hp/a.max,5,a===player?'#f7cf6a':'#78b8c5');
 }
}

function drawCombatFX(){
 ctx.save();
 for(const v of dust){ctx.globalAlpha=Math.max(0,v.t/v.max)*.38;ctx.fillStyle='#b4a5a1';ctx.fillRect(Math.round(v.x),Math.round(v.y),Math.ceil(v.size),Math.ceil(v.size*.55))}
 ctx.globalAlpha=1;
 for(const v of trails){const alpha=v.t/v.max;ctx.globalAlpha=alpha*.9;ctx.strokeStyle=v.heavy?'#ff9b51':'#ffe0a0';ctx.lineWidth=v.heavy?12:7;ctx.beginPath();ctx.arc(v.x,v.y,v.heavy?47:32,-1.15,1.15);ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle='#fff5d2';ctx.beginPath();ctx.arc(v.x,v.y,v.heavy?57:37,-1.1,1.2);ctx.stroke()}
 ctx.globalAlpha=1;
 for(const v of impacts){
  const u=v.t/v.life,alpha=(1-u),r=v.maxR*(1-Math.pow(1-u,2));
  ctx.globalAlpha=alpha*.9;ctx.strokeStyle=v.col;ctx.lineWidth=v.kind==='skill'?7:v.kind==='heavy'?5:3;
  ctx.beginPath();ctx.arc(v.x,v.y,r,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='#fff5d7';ctx.lineWidth=2;
  for(let k=0;k<8;k++){const angle=k*Math.PI/4+v.seed;const r1=r*.62,r2=r+15*(1-u);ctx.beginPath();ctx.moveTo(v.x+Math.cos(angle)*r1,v.y+Math.sin(angle)*r1);ctx.lineTo(v.x+Math.cos(angle)*r2,v.y+Math.sin(angle)*r2);ctx.stroke()}
  if(v.kind==='skill'){ctx.strokeStyle='#ff6c31';ctx.lineWidth=3;ctx.beginPath();ctx.arc(v.x,v.y,r*.6,0,Math.PI*2);ctx.stroke()}
 }
 ctx.restore();
}
function draw(){ctx.save();ctx.translate(rand(-shake,shake),rand(-shake*.5,shake*.5));backdrop();if(cinematic>.12){ctx.fillStyle='rgba(9,9,19,'+Math.min(.52,cinematic*.7)+')';ctx.fillRect(0,0,960,540);for(let i=0;i<17;i++){ctx.fillStyle=i%2?'#ff9e4a40':'#e4583544';ctx.fillRect((i*113+clock*400)%960,0,2,540)}}for(const g of afterimages){const im=spriteImages.rider;if(im.complete&&im.naturalWidth){ctx.save();ctx.globalAlpha=g.alpha*(1-g.age/g.life);ctx.translate(g.x,g.y);ctx.scale(g.face,1);ctx.filter='sepia(1) saturate(4) hue-rotate(-25deg)';ctx.drawImage(im,-66,-161,132,161);ctx.restore()}}for(const w of warnings){ctx.fillStyle='#ff3c5660';ctx.fillRect(w.x-w.r,392,w.r*2,38);ctx.strokeStyle='#ff8892';ctx.strokeRect(w.x-w.r,392,w.r*2,38)}for(const a of fighters)drawF(a);drawCombatFX();for(const v of impactTexts){ctx.globalAlpha=Math.min(1,v.t*3);ctx.font='italic 900 22px monospace';ctx.textAlign='center';ctx.fillStyle='#201520';ctx.fillText(v.label,v.x+2,v.y+3);ctx.fillStyle=v.color;ctx.fillText(v.label,v.x,v.y);ctx.textAlign='start'}ctx.globalAlpha=1;for(const p of shots){ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();rect(p.x-10,p.y-2,20,4,'#ffffff88')}for(const p of particles){ctx.globalAlpha=Math.min(1,p.t*3);rect(p.x,p.y,p.size,p.size,p.col)}ctx.globalAlpha=1;if(screenTint>0){ctx.fillStyle='rgba(255,124,55,'+Math.min(.16,screenTint)+')';ctx.fillRect(0,0,960,540)}if(flash>0){ctx.fillStyle='rgba(255,237,202,'+Math.min(.22,flash*1.3)+')';ctx.fillRect(0,0,960,540)}ctx.restore();if(screen!=='play'){rect(0,0,960,540,'#101422');for(let i=0;i<60;i++)rect((i*173)%960,(i*79)%540,4,4,i%3?'#252a3f':'#514052');ctx.font='bold 17px monospace';ctx.fillStyle='#a7a2b3';ctx.fillText('INSERT COIN · PRESS START',345,504)}}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;if(hitPause>0){hitPause=Math.max(0,hitPause-dt);flash=Math.max(0,flash-dt*.5)}else update(dt);draw();requestAnimationFrame(loop)}
const cards=$('cards');C.forEach((c,i)=>{const b=document.createElement('button');b.className='card';b.innerHTML='<img alt="角色像素造型" src="assets/'+spriteNames[i]+'.png"><strong>'+c.name+'</strong><small>'+c.desc+'</small><small>必殺：'+c.skill+'</small>';b.addEventListener('click',()=>{picked=i;[...cards.children].forEach((x,j)=>x.classList.toggle('active',j===i))});cards.appendChild(b)});cards.children[0].classList.add('active');document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;view('select')}));$('start').addEventListener('click',begin);$('cancel').addEventListener('click',()=>view('menu'));$('back').addEventListener('click',()=>view('menu'));$('again').addEventListener('click',begin);$('home').addEventListener('click',()=>view('menu'));
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;let touching=false;const down=e=>{if((k==='left'||k==='right')&&clock-lastDirAt<.28&&lastDir===k){dashTime=.24;exhaust(player||{x:200},5);tone(230,.09,'sawtooth',.04,110)}if(k==='left'||k==='right'){lastDir=k;lastDirAt=clock;}if(e.cancelable)e.preventDefault();touching=true;if(e.pointerId!==undefined&&b.setPointerCapture){try{b.setPointerCapture(e.pointerId)}catch(_){}}b.classList.add('pressed');if(k in input)input[k]=true;else attack(player,k)};const up=e=>{if(e&&e.cancelable)e.preventDefault();touching=false;b.classList.remove('pressed');if(k in input)input[k]=false};if(window.PointerEvent){b.addEventListener('pointerdown',down,{passive:false});b.addEventListener('pointerup',up,{passive:false});b.addEventListener('pointercancel',up,{passive:false});window.addEventListener('pointerup',e=>{if(touching&&e.target===b)up()})}else{b.addEventListener('touchstart',down,{passive:false});b.addEventListener('touchend',up,{passive:false});b.addEventListener('touchcancel',up,{passive:false})}b.addEventListener('contextmenu',e=>e.preventDefault())});const keys={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',a:'left',d:'right',w:'jump',s:'guard',j:'light',k:'heavy',l:'skill'};window.addEventListener('keydown',e=>{let k=keys[e.key];if(!k)return;e.preventDefault();if(k in input){if((k==='left'||k==='right')&&!e.repeat){if(lastDir===k&&clock-lastDirAt<.28)dashTime=.24;lastDir=k;lastDirAt=clock;}input[k]=true;}else if(!e.repeat)attack(player,k)});window.addEventListener('keyup',e=>{let k=keys[e.key];if(k in input)input[k]=false});$('trainingReset').addEventListener('click',()=>{if(mode==='training'&&boss){boss.hp=9999;boss.x=700;boss.vx=0;boss.stun=0;trainingHits=0;trainingDamage=0;player.hp=100;engine=100;say('DUMMY RESET',.7)}});$('soundToggle').addEventListener('click',()=>{soundOn=!soundOn;$('soundToggle').textContent=soundOn?'♪ ON':'♪ OFF';if(soundOn)tone(440,.07,'sine',.05)});window.addEventListener('blur',()=>Object.keys(input).forEach(k=>input[k]=false));view('menu');requestAnimationFrame(loop);
})();
