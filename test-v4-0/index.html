 if(a.skillRush>0&&a.moveT<=0){ctx.fillStyle='#ffc75a88';for(let k=0;k<4;k++)ctx.fillRect(-w*.8-k*16,-h*.55+k*12,25,5)}
 if(a===player){ctx.fillStyle='#ffdf78';ctx.beginPath();ctx.moveTo(0,-h-12);ctx.lineTo(-10,-h-28);ctx.lineTo(10,-h-28);ctx.fill()}
 if(a.lock>0){ctx.fillStyle='#ff9aa7';ctx.font='bold 14px monospace';ctx.fillText('STOP',-18,-h-30)}

 if(a.team===0&&mode==='boss'){
  rect(a.x-24,a.y-h-38,48,5,'#171923');rect(a.x-24,a.y-h-38,48*a.hp/a.max,5,a===player?'#f7cf6a':'#78b8c5');
 }
}

function drawMoveFX(){
 for(const a of fighters){if(a.moveT<=0)continue;
  const n=a.moveType,t=Math.max(0,1-a.moveT/a.moveTotal),idx=Math.min(15,Math.floor(t*16));
  const fx=pixelFX[n]&&pixelFX[n][idx];if(!fx||!fx.complete||!fx.naturalWidth)continue;
  ctx.save();ctx.translate(Math.round(a.x),Math.round(a.y-80));ctx.scale(a.face,1);
  ctx.globalCompositeOperation='screen';ctx.globalAlpha=.90;
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(fx,-146,-110,292,220);
  ctx.restore();
 }
}
function drawCombatFX(){
 ctx.save();
 for(const v of dust){ctx.globalAlpha=Math.max(0,v.t/v.max)*.38;ctx.fillStyle='#b4a5a1';ctx.fillRect(Math.round(v.x),Math.round(v.y),Math.ceil(v.size),Math.ceil(v.size*.55))}
 ctx.globalAlpha=1;
 for(const v of trails){const alpha=v.t/v.max;ctx.globalAlpha=alpha*.9;ctx.strokeStyle=v.heavy?'#9c6de0':'#ffe0a0';ctx.lineWidth=v.heavy?12:7;ctx.beginPath();ctx.arc(v.x,v.y,v.heavy?47:32,-1.15,1.15);ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle='#fff5d2';ctx.beginPath();ctx.arc(v.x,v.y,v.heavy?57:37,-1.1,1.2);ctx.stroke()}
 ctx.globalAlpha=1;
 for(const v of impacts){
  const u=v.t/v.life,alpha=(1-u),r=v.maxR*(1-Math.pow(1-u,2));
  ctx.globalAlpha=alpha*.9;ctx.strokeStyle=v.col;ctx.lineWidth=v.kind==='skill'?7:v.kind==='heavy'?5:3;
  ctx.beginPath();ctx.arc(v.x,v.y,r,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='#fff5d7';ctx.lineWidth=2;
  for(let k=0;k<8;k++){const angle=k*Math.PI/4+v.seed;const r1=r*.62,r2=r+15*(1-u);ctx.beginPath();ctx.moveTo(v.x+Math.cos(angle)*r1,v.y+Math.sin(angle)*r1);ctx.lineTo(v.x+Math.cos(angle)*r2,v.y+Math.sin(angle)*r2);ctx.stroke()}
  if(v.kind==='skill'){ctx.strokeStyle='#b66af3';ctx.lineWidth=3;ctx.beginPath();ctx.arc(v.x,v.y,r*.6,0,Math.PI*2);ctx.stroke()}
 }
 ctx.restore();
}
function draw(){ctx.save();ctx.translate(rand(-shake,shake),rand(-shake*.5,shake*.5));backdrop();if(cinematic>.12){ctx.fillStyle='rgba(9,9,19,'+Math.min(.52,cinematic*.7)+')';ctx.fillRect(0,0,960,540);for(let i=0;i<17;i++){ctx.fillStyle=i%2?'#ff9e4a40':'#e4583544';ctx.fillRect((i*113+clock*400)%960,0,2,540)}}for(const g of afterimages){const im=spriteImages.rider;if(im.complete&&im.naturalWidth){ctx.save();ctx.globalAlpha=g.alpha*(1-g.age/g.life);ctx.translate(g.x,g.y);ctx.scale(g.face,1);ctx.filter='sepia(1) saturate(4) hue-rotate(-25deg)';ctx.drawImage(im,-66,-161,132,161);ctx.restore()}}for(const w of warnings){ctx.fillStyle='#ff3c5660';ctx.fillRect(w.x-w.r,392,w.r*2,38);ctx.strokeStyle='#ff8892';ctx.strokeRect(w.x-w.r,392,w.r*2,38)}for(const a of fighters)drawF(a);drawMoveFX();drawCombatFX();for(const v of impactTexts){ctx.globalAlpha=Math.min(1,v.t*3);ctx.font='italic 900 22px monospace';ctx.textAlign='center';ctx.fillStyle='#201520';ctx.fillText(v.label,v.x+2,v.y+3);ctx.fillStyle=v.color;ctx.fillText(v.label,v.x,v.y);ctx.textAlign='start'}ctx.globalAlpha=1;for(const p of shots){ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();rect(p.x-10,p.y-2,20,4,'#ffffff88')}for(const p of particles){ctx.globalAlpha=Math.min(1,p.t*3);rect(p.x,p.y,p.size,p.size,p.col)}ctx.globalAlpha=1;if(screenTint>0){ctx.fillStyle='rgba(255,124,55,'+Math.min(.16,screenTint)+')';ctx.fillRect(0,0,960,540)}if(flash>0){ctx.fillStyle='rgba(255,237,202,'+Math.min(.22,flash*1.3)+')';ctx.fillRect(0,0,960,540)}ctx.restore();if(screen!=='play'){rect(0,0,960,540,'#101422');for(let i=0;i<60;i++)rect((i*173)%960,(i*79)%540,4,4,i%3?'#252a3f':'#514052');ctx.font='bold 17px monospace';ctx.fillStyle='#a7a2b3';ctx.fillText('INSERT COIN · PRESS START',345,504)}}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;if(hitPause>0){hitPause=Math.max(0,hitPause-dt);flash=Math.max(0,flash-dt*.5)}else update(dt);draw();requestAnimationFrame(loop)}
const cards=$('cards');C.forEach((c,i)=>{const b=document.createElement('button');b.className='card';b.innerHTML='<img alt="角色像素造型" src="assets/'+spriteNames[i]+'.png"><strong>'+c.name+'</strong><small>'+c.desc+'</small><small>必殺：'+c.skill+'</small>';b.addEventListener('click',()=>{picked=i;[...cards.children].forEach((x,j)=>x.classList.toggle('active',j===i))});cards.appendChild(b)});cards.children[0].classList.add('active');document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;view('select')}));$('start').addEventListener('click',begin);$('cancel').addEventListener('click',()=>view('menu'));$('back').addEventListener('click',()=>view('menu'));$('again').addEventListener('click',begin);$('home').addEventListener('click',()=>view('menu'));
// V2.5 thumb gesture engine: press/drag/release with one pointer, independent movement.
const touchStates=new Map();const combatButtons={light:document.querySelector('[data-key="light"]'),guard:document.querySelector('[data-key="guard"]'),skill:document.querySelector('[data-key="skill"]')};
const HOLD_MS=610;
function pressVisual(k,on){const b=document.querySelector('[data-key="'+k+'"]');if(b)b.classList.toggle('pressed',on)}
function skillAtEnd(s){if(s.used||screen!=='play')return;s.used=true;clearTimeout(s.holdTimer);performMove(0)}
function releasePointer(s){clearTimeout(s.holdTimer);if(s.key in input)input[s.key]=false;pressVisual(s.key,false);if(s.key==='skill'&&!s.used)skillAtEnd(s);if(s.key==='guard')input.guard=false;}
function dragTarget(e){const el=document.elementFromPoint(e.clientX,e.clientY);return el?.closest?.('[data-key]')?.dataset.key||null}
function downPointer(e){const b=e.currentTarget,k=b.dataset.key;if(e.cancelable)e.preventDefault();if(screen!=='play')return;try{b.setPointerCapture(e.pointerId)}catch(_){}
 const s={key:k,start:k,used:false,at:performance.now(),holdTimer:null};touchStates.set(e.pointerId,s);pressVisual(k,true);
 if(k in input)input[k]=true;
 if(k==='left'||k==='right'){if(lastDir===k&&clock-lastDirAt<.28){dashTime=.24;exhaust(player||{x:200},5)}lastDir=k;lastDirAt=clock;}
 if(k==='light')attack(player,'light');
 if(k==='skill'){s.holdTimer=setTimeout(()=>{if(touchStates.get(e.pointerId)===s&&!s.used){s.used=true;performMove(3);}},HOLD_MS);}
}
function movePointer(e){const s=touchStates.get(e.pointerId);if(!s||s.used)return;if(s.start!=='light'&&s.start!=='guard')return;
 const r=combatButtons.skill.getBoundingClientRect();const inSkill=e.clientX>=r.left-15&&e.clientX<=r.right+15&&e.clientY>=r.top-18&&e.clientY<=r.bottom+18;const target=inSkill?'skill':dragTarget(e);if(target==='skill'){
  s.used=true;clearTimeout(s.holdTimer);pressVisual(s.key,false);if(s.key in input)input[s.key]=false;performMove(s.start==='light'?1:2);
  const skillBtn=combatButtons.skill;skillBtn.classList.add('pressed');setTimeout(()=>skillBtn.classList.remove('pressed'),145);
 }}
function upPointer(e){const s=touchStates.get(e.pointerId);if(!s)return;if(e.cancelable)e.preventDefault();releasePointer(s);touchStates.delete(e.pointerId)}
document.querySelectorAll('[data-key]').forEach(b=>{b.style.touchAction='none';b.addEventListener('pointerdown',downPointer,{passive:false});b.addEventListener('pointermove',movePointer,{passive:false});b.addEventListener('pointerup',upPointer,{passive:false});b.addEventListener('pointercancel',upPointer,{passive:false});b.addEventListener('lostpointercapture',upPointer);b.addEventListener('contextmenu',e=>e.preventDefault())});

})();
