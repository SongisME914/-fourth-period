const input={left:false,right:false,jump:false,guard:false};let mode='arcade',picked=0,screen='menu',fighters=[],player,boss,phase=1,last=0,clock=0,shake=0,freeze=0,particles=[],shots=[],warnings=[],noticeT=0,aiFocus=0,combo=0,comboT=0,stageTick=0;

function update(dt){if(screen!=='play')return;clock+=dt;stageTick+=dt;shake=Math.max(0,shake-32*dt);noticeT=Math.max(0,noticeT-dt);comboT=Math.max(0,comboT-dt);if(!noticeT)$('notice').textContent='';for(const a of fighters){if(a.hp<=0)continue;a.cd=Math.max(0,a.cd-dt);a.skillCd=Math.max(0,a.skillCd-dt);a.stun=Math.max(0,a.stun-dt);a.inv=Math.max(0,a.inv-dt);a.atk=Math.max(0,a.atk-dt);a.lastHit=Math.max(0,a.lastHit-dt);a.lock=Math.max(0,a.lock-dt);a.anim+=dt*9;if(a.skillRush>0){a.skillRush-=dt;a.vx=a.face*650;for(const enemy of fighters)if(enemy.team!==a.team&&enemy.hp>0&&Math.abs(enemy.x-a.x)<68&&Math.abs(enemy.y-a.y)<90&&a.cd<.6){hit(a,enemy,9,130);a.cd=.66;fx(enemy.x,enemy.y-40,'#ffda62',8)}}if(a.slam>0){a.slam-=dt;if(a.vy>0&&a.y>340){closeHit(a,29,130,310);fx(a.x,a.y-10,'#7edbff',25);a.slam=0;shake=10}}let L=false,R=false,J=false,G=false;if(a===player){L=input.left;R=input.right;J=input.jump;G=input.guard}else{let target=a.team===1?(aiFocus>0?player:mode==='boss'?fighters.filter(f=>f.team===0&&f.hp>0).sort((x,y)=>Math.abs(x.x-a.x)-Math.abs(y.x-a.x))[0]||player:player):boss;let dx=target.x-a.x;L=dx<-(a.isBoss?100:65);R=dx>(a.isBoss?100:65);J=!a.isBoss&&Math.random()<.007;G=Math.random()<.015;if(Math.abs(dx)<(a.isBoss?150:105)&&a.cd<=0)attack(a,Math.random()<.15?'skill':Math.random()<.35?'heavy':'light');if(a.isBoss&&a.skillCd<=0&&Math.random()<.018)attack(a,'skill')}
